# Base de datos local para desarrollo.
# La aplicación Laravel corre en el host (php artisan serve) y se conecta a este contenedor.
services:
  db:
    image: postgres:16
    container_name: clinica_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinica_vida_salud
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica_dev
    ports:
      - "5433:5432"
    volumes:
      - clinica_pgdata:/var/lib/postgresql/data

  # Interfaz web para ver tablas y ejecutar SQL (solo desarrollo): http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4
    container_name: clinica_pgadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@clinica.test
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"          # sin pantalla de inicio de sesión
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"                        # solo accesible desde esta máquina
    volumes:
      - clinica_pgadmin:/var/lib/pgadmin

volumes:
  clinica_pgdata:
  clinica_pgadmin:
